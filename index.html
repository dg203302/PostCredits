<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/Styles/Dash.css">
    <link rel="icon" type="image/png" href="/Icons/movie roll.png" sizes="32x32">
    <link rel="manifest" href="manifest.json" />
    <title>PostCredits</title>
</head>
<body>
    <div class="page-shell">
        <div class="background-carousel" id="backdrop-container"></div>
        <div class="color-overlay"></div>
        <div class="current-backdrop-info" id="backdrop-info">
            <div class="backdrop-title-row">
                <span class="label">Now Showing</span>
                <span class="title" id="backdrop-title"></span>
            </div>
            <button class="view-backdrop-btn" id="view-backdrop-btn" title="Toggle Backdrop View">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
        </div>
        <header class="hero-header" data-header>
            <div class="hero-header__glow" aria-hidden="true"></div>
            <div class="hero-header__content">
                <div class="hero-header__title-wrapper">
                    <h1 class="hero-header__title neonFlicker">Post Credits</h1>
                </div>
                <p class="hero-header__subtitle">
                    A modern place to explore credits, scenes, and cast details.
                </p>

                <form class="search-bar" data-search-form>
                    <input
                        id="search-query"
                        class="search-bar__input"
                        name="query"
                        type="search"
                        placeholder="Search for movies, TV shows, or people..."
                        autocomplete="off"
                        spellcheck="false"
                        data-search-input
                    >
                </form>

            </div>
            
            <div class="site-credits header-credits">
                Developed by <a href="https://www.diegogarcia-dev.com.ar" target="_blank">dg-dev</a>
            </div>
        </header>

        <main class="content-grid" aria-label="Main content" id="main-content">
            <section class="media-section">
                <h2 class="section-title">In Theaters Near You</h2>
                <div class="media-scroller" id="now-playing-list">
                    <!-- Loaded via JS -->
                </div>
            </section>

            <section class="media-section">
                <h2 class="section-title">Trending Movies</h2>
                <div class="media-scroller" id="trending-movies-list">
                    <!-- Loaded via JS -->
                </div>
            </section>

            <section class="media-section">
                <h2 class="section-title">Latest Series</h2>
                <div class="media-scroller" id="trending-tv-list">
                    <!-- Loaded via JS -->
                </div>
            </section>

            <section class="media-section">
                <h2 class="section-title">Trending People</h2>
                <div class="media-scroller" id="trending-people-list">
                    <!-- Loaded via JS -->
                </div>
            </section>

            <section class="links-section">
                <h2 class="section-title">Explore More</h2>
                <div class="links-grid">
                    <a href="https://www.themoviedb.org/" target="_blank" class="external-link tmdb" title="The Movie Database">
                        <img src="https://www.themoviedb.org/assets/2/v4/logos/v2/blue_short-8e7b30f73a4020692ccca9c88bafe5dcb6f8a62a4c6bc55cd9ba82bb2cd95f6c.svg" alt="TMDB">
                    </a>
                    <a href="https://letterboxd.com/" target="_blank" class="external-link letterboxd" title="Letterboxd">
                        <img src="https://a.ltrbxd.com/logos/letterboxd-logo-h-neg-rgb-1000px.png" alt="Letterboxd">
                    </a>
                    <a href="https://www.imdb.com/" target="_blank" class="external-link imdb" title="IMDb">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/6/69/IMDB_Logo_2016.svg" alt="IMDb">
                    </a>
                    <a href="https://www.rottentomatoes.com/" target="_blank" class="external-link rotten" title="Rotten Tomatoes">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/5/5b/Rotten_Tomatoes.svg" alt="Rotten Tomatoes">
                    </a>
                </div>
            </section>
        </main>
        
        <footer class="site-credits footer-credits">
            Developed by <a href="https://www.diegogarcia-dev.com.ar" target="_blank">dg-dev</a>
        </footer>
    </div>

    <script src="/Scripts/Main.js" defer></script>
</body>
</html>
